name: Keep Supabase alive
on:
  schedule:
    - cron: "0 12 */3 * *" # every 3 days, resets Supabase's 7-day inactivity pause
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "https://lziakqwcjkkksjtvkqip.supabase.co/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
