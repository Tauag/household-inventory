name: Keep Supabase alive
on:
  schedule:
    - cron: "0 12 * * *" # daily, resets Supabase's 7-day inactivity pause
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "https://lziakqwcjkkksjtvkqip.supabase.co/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
